name: Reproducible resume V8.7.2 tests

on:
  push:
    branches:
      - "codex/adaptive-granularity-bilevel-v7"
      - "codex/all-level-counterfactual-v8"
      - "codex/safe-counterfactual-v8-1"
      - "codex/calibrated-counterfactual-v8-2"
      - "codex/two-stage-safe-router-v8-3"
      - "codex/confidence-budget-router-v8-4"
      - "codex/consistency-credit-router-v8-5"
      - "codex/part-anchored-residual-v8-6"
      - "codex/dataset-presets-v8-7"
      - "codex/frozen-v85-solver-v8-7-1"
      - "codex/reproducible-resume-v8-7-2"
  pull_request:

jobs:
  tensor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          pip install numpy==1.26.4
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: python -m compileall -q deit
      - name: Test bilevel invariants
        run: >-
          PYTHONPATH=deit python -m unittest -v
          deit/test_reproducibility.py
          deit/test_semantic_bilevel.py
